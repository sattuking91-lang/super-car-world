workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Unzip project
        script: |
          unzip -o super-car-world.zip
          ls -R | head -n 100
      - name: Fix Gradle version
        script: |
          cat gradle/wrapper/gradle-wrapper.properties || true
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          ls -la gradlew || echo "no gradlew"
      - name: Build APK
        script: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
